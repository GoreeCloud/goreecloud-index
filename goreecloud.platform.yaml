schema_version: '0.2'

component:
  type: application
  id: goreecloud-index
  product_name: GoreeCloud Index
  repository: GoreeCloud/goreecloud-index

lifecycle: development
version: 0.3.0-dev

supported_platforms:
  - android

api:
  versions: []
  endpoints: []

platform_systems:
  manager:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - CONFORMANCE.md
    notes: GoreeCloud Manager operational visibility is applicable to Index, but no accepted Manager runtime integration or Index operational-status publication exists.
  privacy_shield:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - CONFORMANCE.md
    notes: Index has a fail-closed source authority model that keeps Android permission distinct from Privacy Shield decisions, but accepted producer-authoritative Privacy Shield runtime adapters, retained-decision lifecycle, and acceptance evidence are incomplete.
  wardveil_security:
    result: applicable-blocked
    version: null
    evidence:
      - CONFORMANCE.md
    notes: Index does not infer Wardveil trust from provider success, but accepted provider/action security evidence integration and production security acceptance are incomplete.
  everkeep:
    result: applicable-blocked
    version: null
    evidence:
      - CONFORMANCE.md
    notes: Current query state is transient and no intentional persistent query history exists, but any applicable durable Index configuration/settings still requires an accepted Everkeep continuity contract and recovery evidence before Stable qualification.
  glaze_ui:
    result: applicable-migration-required
    version: '2.1.0'
    evidence:
      - README.md
      - CONFORMANCE.md
    notes: Authoritative Index main still records Glaze UI 2.1.0 source targeting. Current published Stable consumer authority is V1.1 / 1.1.0, so migration is required. Draft PR #16 contains a Development V1.1 Compose mapping but is unmerged; the published 1.1.0 source also has the known immutable import-closure defect pending a corrected consumer-eligible Stable release and explicit downstream revalidation.
  mesh:
    result: applicable-blocked
    version: null
    evidence:
      - CONFORMANCE.md
    notes: Mesh-backed provider discovery/coordination remains planned and no accepted Mesh runtime registration, discovery, event, dependency, or transport evidence exists for Index.
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []
  identity:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - CONFORMANCE.md
    notes: Index source distinguishes Identity authorization from authentication and Android permission, but accepted producer-authoritative Identity authorization/runtime integration and user/profile isolation evidence are incomplete.

health:
  health_endpoint: null
  readiness_endpoint: null

continuity:
  backup:
    required: false
    requirements: []
  restore:
    required: false
    requirements: []
  export:
    required: false
    requirements: []
  portability:
    required: false
    requirements: []

external_dependencies: []

compatibility:
  platform_contract: '0.2'
  glaze_ui_required: '1.1.0'
  requires:
    - goreecloud-platform-contract==0.2
    - glaze-ui==1.1.0
  provides:
    - index-local-provider-contract
    - index-search-action-contract

evidence:
  acceptance_tests: []
  release: []

conformance:
  status: nonconformant
  validated_at: null
  evidence:
    - README.md
    - CONFORMANCE.md
    - ARCHITECTURE.md
    - CAPABILITIES.md
  blockers:
    - GoreeCloud Manager operational integration and acceptance are incomplete.
    - Producer-authoritative Privacy Shield runtime integration and decision lifecycle acceptance are incomplete.
    - Wardveil Security provider/action evidence integration and security acceptance are incomplete.
    - Everkeep applicability and recovery requirements for any durable Index configuration/settings have not been accepted.
    - Authoritative Index main still targets superseded Glaze UI 2.1.0; current published Stable V1.1 / 1.1.0 migration and downstream acceptance remain incomplete, and the known immutable 1.1.0 import-closure defect still requires a corrected consumer-eligible Stable release before current conformance can be claimed.
    - GoreeCloud Mesh provider discovery/coordination integration and runtime acceptance are incomplete.
    - GoreeCloud Identity authorization adapter, user/profile isolation, revocation, and runtime acceptance are incomplete.
    - Index exposes no accepted health/readiness interfaces for GoreeCloud Manager or platform observability.
    - Representative Android device acceptance, accessibility, localization/RTL, form-factor/performance, production signing/distribution, recovery decisions, and release provenance are incomplete.
    - No Stable or production-approved GoreeCloud Index release evidence is declared.
