schema_version: '0.3'

component:
  type: application
  id: goreecloud-index
  product_name: GoreeCloud Index
  repository: GoreeCloud/goreecloud-index

lifecycle: development
version: 0.3.0-dev

supported_platforms:
  - android

api:
  versions: []
  endpoints: []

platform_systems:
  manager:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - CONFORMANCE.md
    notes: GoreeCloud Manager operational visibility is applicable to Index, but no accepted Manager runtime integration or Index operational-status publication exists.
  privacy_shield:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - CONFORMANCE.md
      - app/src/main/java/com/goreecloud/index/provider/search/PrivacyShieldSearchAuthorizationAdapter.kt
      - app/src/main/java/com/goreecloud/index/provider/search/GoreeCloudSearchProvider.kt
    notes: Index has fail-closed source authority models for local providers and operation-scoped remote Search authorization, but accepted producer-authoritative Privacy Shield runtime adapters, decision acquisition/IPC, retained-decision lifecycle where applicable, and production acceptance evidence are incomplete.
  wardveil_security:
    result: applicable-blocked
    version: null
    evidence:
      - CONFORMANCE.md
    notes: Index does not infer Wardveil trust from provider success, but accepted provider/action security evidence integration and production security acceptance are incomplete.
  everkeep:
    result: applicable-blocked
    version: null
    evidence:
      - CONFORMANCE.md
    notes: Current query state is transient and no intentional persistent query history exists, but any applicable durable Index configuration/settings still requires an accepted Everkeep continuity contract and recovery evidence before Stable qualification.
  glaze_ui:
    result: applicable-migration-required
    version: '1.5.0'
    evidence:
      - README.md
      - CONFORMANCE.md
      - app/src/main/java/com/goreecloud/index/ui/theme/GlazeV15Contract.kt
      - app/src/main/java/com/goreecloud/index/ui/theme/IndexTheme.kt
      - app/src/test/java/com/goreecloud/index/ui/theme/GlazeV15ContractTest.kt
      - docs/development/glaze-v1.5-stable-adoption.md
    notes: Index Development source now targets current Official Stable GLAZE UI V1.5 / 1.5.0 at exact Stable authority b7fa8164bfdeaa1dc0acb21b770e7601120da04e and reviewed implementation anchor ee1032a0822ab8e103f8afe48e5c1859fde65cc9. The native Compose visual baseline inherits V1.4.1 at 4fab9da0fad2e5c974e0e66ec88632c61745751c, which remains the immediate rollback baseline. V1.5 capability presentation consumes only explicit authority-owned state, fails closed on missing or conflicting capability ownership, and cannot infer Privacy Shield, Identity, provider precedence, navigation, or execution authority. Source adoption does not establish application conformance; Index-specific rendered/native, accessibility, localization/RTL, representative-device/form-factor, performance, rollback, and production acceptance remain incomplete, so migration-required remains the correct state.
  mesh:
    result: applicable-blocked
    version: null
    evidence:
      - CONFORMANCE.md
    notes: Mesh-backed provider discovery/coordination remains planned and no accepted Mesh runtime registration, discovery, event, dependency, or transport evidence exists for Index.
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []
  identity:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - CONFORMANCE.md
    notes: Index source distinguishes Identity authorization from authentication and Android permission, but accepted producer-authoritative Identity authorization/runtime integration, requester/service identity, direct-service authentication, and user/profile isolation evidence are incomplete.

health:
  health_endpoint: null
  readiness_endpoint: null

continuity:
  backup:
    required: false
    requirements: []
  restore:
    required: false
    requirements: []
  export:
    required: false
    requirements: []
  portability:
    required: false
    requirements: []

external_dependencies: []

compatibility:
  platform_contract: '0.3'
  glaze_ui_required: '1.5.0'
  requires:
    - goreecloud-platform-contract==0.3
    - glaze-ui==1.5.0
  provides:
    - index-local-provider-contract
    - index-search-action-contract

evidence:
  acceptance_tests: []
  release: []

conformance:
  status: nonconformant
  validated_at: null
  evidence:
    - README.md
    - CONFORMANCE.md
    - ARCHITECTURE.md
    - CAPABILITIES.md
    - app/src/main/java/com/goreecloud/index/ui/theme/GlazeV15Contract.kt
    - app/src/main/java/com/goreecloud/index/ui/theme/IndexTheme.kt
    - app/src/test/java/com/goreecloud/index/ui/theme/GlazeV15ContractTest.kt
    - docs/development/glaze-v1.5-stable-adoption.md
  blockers:
    - GoreeCloud Manager operational integration and acceptance are incomplete.
    - Producer-authoritative Privacy Shield runtime integration, remote Search decision acquisition, and decision lifecycle acceptance are incomplete.
    - Wardveil Security provider/action evidence integration and security acceptance are incomplete.
    - Everkeep applicability and recovery requirements for any durable Index configuration/settings have not been accepted.
    - Current Stable GLAZE UI V1.5 / 1.5.0 source mapping exists with the inherited V1.4.1 visual baseline, but Index-specific rendered/native, accessibility, localization/RTL, representative-device/form-factor, performance, rollback, and production acceptance evidence remain incomplete.
    - GoreeCloud Mesh provider discovery/coordination integration and runtime acceptance are incomplete.
    - GoreeCloud Identity authorization adapter, user/profile isolation, revocation, requester/service identity, direct-service authentication, and runtime acceptance are incomplete.
    - GoreeCloud Sync remains a separate application/service capability; dataset contracts and accepted runtime synchronization/reconciliation evidence for any applicable durable Index state are incomplete, and transient query text/history must not be synchronized by default.
    - Index exposes no accepted health/readiness interfaces for GoreeCloud Manager or platform observability.
    - Representative Android device acceptance, accessibility, localization/RTL, form-factor/performance, production signing/distribution, recovery decisions, and release provenance are incomplete.
    - No Stable or production-approved GoreeCloud Index release evidence is declared.
